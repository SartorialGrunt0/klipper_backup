[mcu expander]
serial: /dev/serial/by-id/usb-Klipper_stm32f042x6_36001900144330534E373720-if00
restart_method: command

#[output_pin mosfet0]
#pin: expander:PA0
#value: 0
#shutdown_value: 0

[output_pin mosfet1]
pin: expander: PA1
value: 0
shutdown_value: 0

[output_pin mosfet2]
pin: expander: PA2
value: 0
shutdown_value: 0

#[output_pin mosfet3]
#pin: expander:PA3
#value: 0
#shutdown_value: 0

# Status LED lights when klipper connects 
[static_digital_output onboardLED]
pins: !expander: PA4


[neopixel expanderPixel]
pin: expander: PB1
chain_count: 1
initial_RED: 0.9
initial_GREEN: 0.3
initial_BLUE: 0.0

[temperature_sensor Electronics_Bay]
sensor_pin: expander:PA5
sensor_type: Generic 3950
min_temp: 0
max_temp: 100
# T0 = PA6