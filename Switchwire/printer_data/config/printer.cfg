 G90
 G0 Z50
 #G0 X117.5 F9000
 #
 #RESPOND TYPE=error MSG='Reattach Your Probe! Docks in 30 seconds'
 #
 #G4 P30000 #30 Seconds
 #ATTACH_PROBE 
 #printer.probe.last_query

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: _SCREWS_TILT_CALCULATE
gcode: 
  {% if "xyz" not in printer.toolhead.homed_axes %}
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=1
    G28
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=0
  {% else %}
    ATTACH_PROBE
  {% endif %}
  _SCREWS_TILT_CALCULATE
  DETACH_PROBE

[gcode_macro PROBE_ACCURACY]
rename_existing: _PROBE_ACCURACY
gcode:
  {% set SAMPLES  = params.SAMPLES|default("10")|int %}
  {% set X_POS = params.X_POS|default("117.5")|int %}
  {% set Y_POS  = params.Y_POS|default("117.5")|int %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=1
    G28
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=0
  {% else %}
    ATTACH_PROBE
  {% endif %}
  G0 X{X_POS} Y{Y_POS} Z5 F9000
  G0 Z4 F6000
  G4 P2000
  _PROBE_ACCURACY SAMPLES={SAMPLES}
  DETACH_PROBE

#####################################################################
#   NeoPixel
#####################################################################
[neopixel stealthburner]
pin: PC7
chain_count: 3
color_order: GRBW
initial_RED: 0.2
initial_GREEN: 1
initial_BLUE: 0

################
#   Sensors
################
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

#####################################################################
#   Fan Control
#####################################################################

######
# Electronics Bay Fan
###############
[controller_fan Electronics_Bay]
pin: expander: PA3
max_power: 1.00
kick_start_time: 0.200
heater: heater_bed

######
# Hot End Fan
###############
[heater_fan heatbreak_fan]
pin: expander: PA0
heater: extruder
heater_temp: 50.0
##  If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

######
# Part Cooling Fan
# FAN0 Connector
###############
[fan]
pin: PA8  # "FAN0"
cycle_time: .08
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
kick_start_time: .25

#####################################################################
#   Homing and Bed Mesh
#####################################################################

[bed_mesh]
speed: 300
horizontal_move_z: 5
mesh_min: 1,20
mesh_max: 220,220
probe_count: 5,5
algorithm: bicubic
mesh_pps: 3, 3
fade_start: 1
fade_end: 10
fade_target: 0
zero_reference_position: 117.5, 117.5

[screws_tilt_adjust]
screw1: 25,3
screw1_name: front left screw
screw2: 195,3
screw2_name: front right screw
screw3: 195,180
screw3_name: rear right screw
screw4: 25,180
screw4_name: rear left screw
horizontal_move_z: 4 
speed: 300
screw_thread: CW-M4

#####################################################################
#   Macros
#####################################################################
[gcode_macro M109]
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}
    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    {% endif %}

[gcode_macro M190]
rename_existing: M99190
gcode:
    #Parameters
    {% set s = params.S|float %}

    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   ; Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s} MAXIMUM={s+1}  ; Wait for bed temp (within 1 degree)
    {% endif %}



[servo klicky_servo]
#check were your servo is wired
pin: PC15
maximum_servo_angle: 180
minimum_pulse_width: 0.00025
maximum_pulse_width: 0.0024
#minimum_pulse_width: 0.0010     # 1.0 ms
#maximum_pulse_width: 0.0020     # 2.0 ms


[gcode_macro _servo_test_angle]
gcode:
	{% set ANGLE  = params.ANGLE|int %}
	
    SET_SERVO SERVO=klicky_servo ANGLE={ANGLE}
    G4 P250
    SET_SERVO SERVO=klicky_servo WIDTH=0.0

[gcode_macro _servo_test_time]
gcode:
    {% set TIME  = params.TIME|int %}
    SET_SERVO SERVO=klicky_servo ANGLE=30
    G4 P{TIME}
    SET_SERVO SERVO=klicky_servo WIDTH=0

    G4 P5000
    
    SET_SERVO SERVO=klicky_servo ANGLE=150
    G4 P{TIME}
    SET_SERVO SERVO=klicky_servo WIDTH=0

[gcode_macro PRINT_START]
variable_printing: 0
gcode:
  
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=1
  # This part fetches data from your slicer. Such as bed, extruder, and chamber temps and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  #{% set target_chamber = params.CHAMBER|default("45")|int %}
  #{% set target_chamber_minimal = params.CHAMBER_MINIMAL|default("0")|int %}
  #{% set target_chamber_wait = [target_chamber, target_chamber_minimal]|select(">", 0)|min|default(0) %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  ##  Uncomment for Beacon Contact (1 of 4 for beacon contact)
  #SET_GCODE_OFFSET Z=0                                 # Set offset to 0

  # Clear any lingering pause states
  #CLEAR_PAUSE

  # Home the printer, set absolute positioning and update the Stealthburner LEDs.
  #STATUS_HOMING                                         # Set LEDs to homing-mode
  G28                                                   # Full home (XYZ)
  G90                                                   # Absolute position

  ##  Uncomment for bed mesh (1 of 2 for bed mesh)
  #BED_MESH_CLEAR                                       # Clear old saved bed mesh (if any)

  # Check if the bed temp is higher than 90c - if so then trigger a heatsoak.
  #{% if params.BED|int > 90 %}
  #SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Display info on display
  #STATUS_HEATING                                      # Set LEDs to heating-mode
  #M106 S255                                           # Turn on the PT-fan

    ##  Uncomment if you have a Nevermore.
    #SET_PIN PIN=nevermore VALUE=1                      # Turn on the nevermore

    #G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center of the bed
    #M190 S{target_bed}                                  # Set the target temp for the bed
    #SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber_wait}c"  # Display info on display
    #TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber_wait}   # Waits for chamber temp

  # If the bed temp is not over 90c, then skip the heatsoak and just heat up to set temp with a 5 min soak
  #{% else %}
  SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Display info on display
  #STATUS_HEATING                                      # Set LEDs to heating-mode
  G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center of the bed
  M190 S{target_bed}                                  # Set the target temp for the bed
  SET_DISPLAY_TEXT MSG="Soak for 5 min"               # Display info on display
  #G4 P300000                                          # Wait 5 min for the bedtemp to stabilize
  G4 P150000                                          # Wait 2.5 min for the bedtemp to stabilize
  #{% endif %}

  # Heat hotend to 150c. This helps with getting a correct Z-home.
  SET_DISPLAY_TEXT MSG="Hotend: 150c"                   # Display info on display
  M104 S150                                             # Heat hotend to 150c

  ##  Uncomment for Beacon contact (2 of 4 for beacon contact)
  #G28 Z METHOD=CONTACT CALIBRATE=1                     # Calibrate z offset and beacon model

  ##  Uncomment for Trident (Z_TILT_ADJUST)
  #SET_DISPLAY_TEXT MSG="Leveling"                      # Display info on display
  #STATUS_LEVELING                                      # Set LEDs to leveling-mode
  #Z_TILT_ADJUST                                        # Level the printer via Z_TILT_ADJUST
  #G28 Z                                                # Home Z again after Z_TILT_ADJUST

  ##  Uncomment for V2.4 (Quad gantry level AKA QGL)
  #SET_DISPLAY_TEXT MSG="Leveling"                      # Display info on display
  #STATUS_LEVELING                                      # Set LEDs to leveling-mode
  #QUAD_GANTRY_LEVEL                                    # Level the printer via QGL
  #G28 Z                                                # Home Z again after QGL

  ##  Uncomment for bed mesh (2 of 2 for bed mesh)
  SET_DISPLAY_TEXT MSG="Bed mesh"                      # Display info on display
  #STATUS_MESHING                                       # Set LEDs to bed mesh-mode
  BED_MESH_CALIBRATE # Start the bed mesh (add ADAPTIVE=1) for adaptive bed mesh
  SMART_PARK
  ## Uncomment for Beacon Contact (3 of 4 for beacon contact)
  #G28 Z METHOD=CONTACT CALIBRATE=0                     # Calibrate z offset only with hot nozzle

  # Heat up the hotend up to target via data from slicer
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"     # Display info on display
  #STATUS_HEATING                                        # Set LEDs to heating-mode
  G1 X{x_wait} Y{y_wait} Z15 F9000                      # Go to center of the bed
  M107                                                  # Turn off partcooling fan
  M109 S{target_extruder} # Heat the hotend to set temp
  LINE_PURGE
  #SET_GCODE_VARIABLE MACRO=ATTACH_PROBE VARIABLE=printing VALUE=0

[gcode_macro PRINT_END]
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament
    G91                            ; relative positioning
    G0 Z1 F1500
    G0 X5 Y5 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z10 F1500                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0  X117.5 Y220 F3600            ; park nozzle at rear
    BED_MESH_CLEAR
    M106 S255
    TEMPERATURE_WAIT SENSOR=extruder  MAXIMUM=50 
    M106 S0
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=0

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
    #SET_LED LED="Chamber_LEDs" RED=1 GREEN=1 BLUE=0 SYNC=0 TRANSMIT=1
    ##### set defaults #####
    {% set x = params.X|default(117.5) %}      #edit to your park position
    {% set y = params.Y|default(220) %}      #edit to your park position
    {% set z = params.Z|default(10)|float %} #edit to your park position
    {% set e = params.E|default(1) %}        #edit to your retract length
    ##### calculate save lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set lift_z = z|abs %}
    {% if act_z < (max_z - lift_z) %}
        {% set z_safe = lift_z %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    ##### end of definitions #####
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-{e} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}    
      G1 Z{z_safe}
      G90
      G1 X{x} Y{y} F6000
    {% else %}
      {action_respond_info("Printer not homed")}
    {% endif %}

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    ##### set defaults #####
    {% set e = params.E|default(1) %} #edit to your retract length
    #### get VELOCITY parameter if specified ####
    {% if 'VELOCITY' in params|upper %}
      {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
    {%else %}
      {% set get_params = "" %}
    {% endif %}
    ##### end of definitions #####
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E{e} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}  
    RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  #SET_LED LED="Chamber_LEDs" RED=1 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1
  CANCEL_PRINT_BASE
  M400                           ; wait for buffer to clear
  G92 E0                         ; zero the extruder
  G1 E-10.0 F3600                ; retract filament
  G91                            ; relative positioning
  G0 Z1 F1500
  G0 X5 Y5 F20000    ; move nozzle to remove stringing
  TURN_OFF_HEATERS
  M107                           ; turn off fan
  G1 Z10 F1500                    ; move nozzle up 2mm
  G90                            ; absolute positioning
  G0  X117.5 Y220 F3600            ; park nozzle at rear
  BED_MESH_CLEAR
  M106 S255
  TEMPERATURE_WAIT SENSOR=extruder  MAXIMUM=50 
  M106 S0
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=0

