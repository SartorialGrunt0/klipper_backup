[include mainsail.cfg]
[include KAMP_Settings.cfg]
[include sensorless.cfg]
[include klipper_expander.cfg]
[include klipper-mini12864.cfg]
[include moonraker_obico_macros.cfg]
[include Test_Speed.cfg]
#[include PIS.cfg]
#[include shake_tune.cfg]

[exclude_object]

[force_move]
enable_force_move: True

[idle_timeout]
timeout: 1800

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_37FFDB054246383438820857-if00
baud: 250000
restart_method: command

[virtual_sdcard]
path: /home/clifgall/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexz
max_velocity: 350 #Ellis Tuned
max_accel: 11500 #Ellis Tuned
max_z_velocity: 100
max_z_accel: 3000
square_corner_velocity: 5.0

[input_shaper]
shaper_type_x = mzv
shaper_freq_x = 56.8
#max_accel_x: 9430
shaper_type_y = mzv
shaper_freq_y = 40.6
#max_accel_y: 4530

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
rotation_distance: 40
full_steps_per_rotation: 200
microsteps: 32
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 222
homing_speed: 70
homing_positive_dir: false
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PB15
diag_pin: PC0 #Sensorless homing
run_current: 1.2
interpolate: True
stealthchop_threshold: 0
driver_SGTHRS: 127
#driver_SGTHRS: 132
#driver_SGTHRS: 115

#####################################################################
#   Y Stepper Settings
#####################################################################

######
# Motor -YM
# Endstop - Y-STOP
###############
[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
rotation_distance: 40
full_steps_per_rotation: 200
microsteps: 32
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_retract_dist: 0 # Uncomment this line too
position_endstop: -3
position_min: -3
position_max: 235
homing_speed: 70
homing_positive_dir: false

[tmc2209 stepper_y]
uart_pin: PC6
diag_pin: ^PC1
run_current: 1
interpolate: True
stealthchop_threshold: 0
#driver_SGTHRS: 135 # tune this once it's working.
driver_SGTHRS: 140

#####################################################################
#   Z Stepper Settings
#####################################################################

######
# Motor -ZAM
# Endstop - Z-STOP
###############
[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
rotation_distance: 40
full_steps_per_rotation: 200
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 207
homing_speed: 40
position_min: -3.0

[tmc2209 stepper_z]
uart_pin: PC10
run_current: 1.2
interpolate: True
stealthchop_threshold: 0

#####################################################################
#   Extruder Settings
#####################################################################

######
#Motor - EM
###############
[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD2
rotation_distance: 22.6789511   #Bondtech 5mm Drive Gears
##  Use 50:10 for Stealthburner/Clockwork 2
gear_ratio: 50:10
microsteps: 32
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: PC8
sensor_pin: PC3
sensor_type: ATC Semitec 104GT-2
#sensor_type: Generic 3950
smooth_time: 2.0
min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
#control = pid
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721
max_extrude_only_distance: 100.0
max_extrude_cross_section: 5

[tmc2209 extruder]
uart_pin: PC11
run_current: 1
hold_current: 0.7
interpolate: True

[autotune_tmc extruder]
motor: siboor-14sth20-1004a

#####################################################################
#   Bed Heater
#####################################################################

######
# BED Connector
###############
[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 115

#####################################################################
#   Probe
#####################################################################

######
#Z Max Connector on Z(main) Board
#Inductive Probe
###############
[probe]
##      If your probe is NO instead of NC, add change pin to !z:P1.24
pin: ^PC14
x_offset: 0.0
y_offset: 19.75
#z_offset: 3.676
speed: 3
lift_speed: 100
samples: 3
samples_result: median
sample_retract_dist: 0.6
samples_tolerance: 0.02
samples_tolerance_retries: 10

[gcode_macro ATTACH_PROBE]
variable_attached: 0
gcode:
     
     {% set F = 4500 %}
     SAVE_GCODE_STATE NAME=attach_probe_state
     SET_VELOCITY_LIMIT ACCEL=1000
     {% if "x" not in printer.toolhead.homed_axes %}
       G28 X
     {% endif %}
     
     {% if "z" not in printer.toolhead.homed_axes%}
       SET_KINEMATIC_POSITION Z=0
       G91
       G0 Z25 F6000
       G90
       SET_KINEMATIC_POSITION CLEAR_HOMED=Z
     {% elif printer.toolhead.position.z < 25 %}
        G1 Z25 F6000
     {% endif %}
     
     G90
     G0 X165 F{F}
     SET_SERVO SERVO=klicky_servo ANGLE=40
     G4 P500
     SET_SERVO SERVO=klicky_servo ANGLE=110
     G4 P500
     SET_SERVO SERVO=klicky_servo WIDTH=0
     G4 P500
     RESTORE_GCODE_STATE NAME=attach_probe_state
     SET_VELOCITY_LIMIT ACCEL=11500
     SET_GCODE_VARIABLE MACRO=ATTACH_PROBE VARIABLE=attached VALUE=1

[gcode_macro DETACH_PROBE]
gcode:    
     {% set F =4500 %}
     SAVE_GCODE_STATE NAME=detach_probe_state
     G90
     SET_VELOCITY_LIMIT ACCEL=1000

     {% if "x" not in printer.toolhead.homed_axes %}
       G28 X
     {% endif %}
     
     {% if "z" not in printer.toolhead.homed_axes%}
       SET_KINEMATIC_POSITION Z=0
       G91
       G0 Z25 F6000
       G90
       SET_KINEMATIC_POSITION CLEAR_HOMED=Z
     {% elif printer.toolhead.position.z < 25 %}
       G1 Z25 F6000
     {% endif %}
     G90
     G0 X165 F21000
     SET_SERVO SERVO=klicky_servo ANGLE=40
     G4 P500
     G0 X117.5 F{F}
     SET_SERVO SERVO=klicky_servo ANGLE=110
     G4 P500
     SET_SERVO SERVO=klicky_servo WIDTH=0
     SET_VELOCITY_LIMIT ACCEL=11500
     RESTORE_GCODE_STATE NAME=detach_probe_state
     SET_GCODE_VARIABLE MACRO=ATTACH_PROBE VARIABLE=attached VALUE=0

#[gcode_macro BED_MESH_CALIBRATE]
#rename_existing: _BED_MESH_CALIBRATE
#gcode: 
# {% if "xyz" not in printer.toolhead.homed_axes %}
#   G28
# {% endif %}
